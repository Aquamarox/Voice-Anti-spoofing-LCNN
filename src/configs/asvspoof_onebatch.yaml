defaults:
  - model: lcnn
  - writer: wandb
  - metrics: asvspoof
  - datasets: asvspoof_onebatch
  - dataloader: asvspoof_onebatch
  - transforms: asvspoof_onebatch
  - _self_

model:
  input_width: 100
  dropout: 0.0

optimizer:
  _target_: torch.optim.Adam
  lr: 3e-4

lr_scheduler:
  _target_: torch.optim.lr_scheduler.StepLR
  step_size: 200
  gamma: 1.0

loss_function:
  _target_: src.loss.AntiSpoofingLoss

trainer:
  log_step: 5
  n_epochs: 1
  epoch_len: 200

  device_tensors:
    - data_object
    - labels

  resume_from: null
  device: auto
  override: true

  monitor: "off"
  save_period: 1
  early_stop: 1

  save_dir: saved
  seed: 1

writer:
  project_name: voice-anti-spoofing-lcnn
  run_name: one-batch-test
  mode: offline